# Lints staged files before each commit. Tests run in CI, not here.
# Install once after cloning: lefthook install
pre-commit:
  parallel: true
  jobs:
    - name: web biome
      root: apps/web/
      glob:
        - "*.{js,jsx,ts,tsx,json,jsonc,css,html}"
        - "**/*.{js,jsx,ts,tsx,json,jsonc,css,html}"
      # --no-install makes npx fail when Biome is not installed locally (run "npm install"
      # in apps/web) instead of downloading it. The scoped name matters: a bare "biome"
      # is an unrelated npm package that npx would fetch, or reuse from its cache.
      run: npx --no-install @biomejs/biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: api ruff check
      root: apps/api/
      glob: &python_files
        - "*.py"
        - "**/*.py"
      run: uv run ruff check {staged_files}

    - name: api ruff format
      root: apps/api/
      glob: *python_files
      run: uv run ruff format --check {staged_files}

    - name: transcriber ruff check
      root: services/transcriber/
      glob: *python_files
      run: uv run ruff check {staged_files}

    - name: transcriber ruff format
      root: services/transcriber/
      glob: *python_files
      run: uv run ruff format --check {staged_files}
